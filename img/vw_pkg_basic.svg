      <path d="M 30,-44 L 52,-16 L 18,-12 Z" fill="#C8392E" stroke="none"/>
      <path d="M -30,44 L -52,16 L -18,12 Z" fill="#C8392E" stroke="none"/>
    </g>
    <g id="p-lang" stroke="#C8392E" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-46" y="-48" width="92" height="72" rx="16" stroke-width="10"/>
      <path d="M -14,24 L -22,46 L 6,24" stroke-width="10"/>
      <text x="0" y="2" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="46" fill="#C8392E" stroke="none" text-anchor="middle">A</text>
    </g>
    <g id="p-snow" stroke="#C8392E" fill="none" stroke-linecap="round" stroke-width="9">
      <path d="M 0,0 L 0,-46 M -12,-30 L 0,-42 L 12,-30"/>
      <path d="M 0,0 L 0,-46 M -12,-30 L 0,-42 L 12,-30" transform="rotate(60)"/>
