<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <g id="vw-emblem" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="17.2"/>
      <path d="M13.6 6.2 L20 24.8 L26.4 6.2"/>
      <path d="M5.7 14.8 L14.8 34.3 L20 24.8 L25.2 34.3 L34.3 14.8"/>
    </g>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- внешний контур для читаемости на светлом фоне -->
  <circle cx="20" cy="20" r="19.5" fill="none" stroke="#274B66" stroke-width="1.5"/>

  <!-- ореол (размытый слой) -->
  <use href="#vw-emblem" xlink:href="#vw-emblem" stroke="#D64541" stroke-width="6.5" filter="url(#halo)"/>
  <!-- основной контур (толще для видимости) -->
  <use href="#vw-emblem" xlink:href="#vw-emblem" stroke="#D64541" stroke-width="5"/>
  <!-- тонкий светлый блик -->
  <use href="#vw-emblem" xlink:href="#vw-emblem" stroke="#F2A19B" stroke-width="1.8" opacity="0.9"/>
</svg>